<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Dashboard de Crece - Iniciar Sesión</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Raleway:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
      width: 100%;
      font-family: 'Raleway', sans-serif;
      -webkit-user-select: none;
      user-select: none;
    }

    :root {
      --gold: #E0C34B;
      --bronze: #AB9256;
      --coral: #C87F7F;
      --charcoal: #323e45;
      --warm-gray: #7A7A7A;
      --bg-warm: #faf8f4;

      --text-primary: var(--charcoal);
      --text-secondary: var(--warm-gray);
      --bg-primary: var(--bg-warm);
      --bg-secondary: #ffffff;
      --button-primary: var(--coral);
      --border-color: var(--bronze);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --text-primary: #f5f1ed;
        --text-secondary: #c0b5a8;
        --bg-primary: #2d2520;
        --bg-secondary: #3a3228;
        --button-primary: #e8a4a4;
        --border-color: #8b7b6b;
      }
    }

    body {
      background-color: var(--bg-primary);
      color: var(--text-primary);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .login-container {
      width: 100%;
      max-width: 400px;
      background-color: var(--bg-secondary);
      border-radius: 12px;
      padding: 40px 30px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
      animation: slideUp 0.5s ease-out;
    }

    @keyframes slideUp {
      from {
        transform: translateY(20px);
        opacity: 0;
      }
      to {
        transform: translateY(0);
        opacity: 1;
      }
    }

    .logo-badge {
      display: flex;
      justify-content: center;
      margin-bottom: 24px;
    }

    .logo-badge img {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      border: 3px solid var(--gold);
    }

    h1 {
      font-family: 'Playfair Display', serif;
      font-size: 24px;
      font-weight: 700;
      text-align: center;
      margin-bottom: 12px;
      color: var(--text-primary);
    }

    .subtitle {
      text-align: center;
      font-size: 14px;
      color: var(--text-secondary);
      margin-bottom: 24px;
      line-height: 1.5;
    }

    .form-group {
      margin-bottom: 20px;
    }

    input[type="email"] {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      font-family: 'Raleway', sans-serif;
      font-size: 14px;
      background-color: var(--bg-primary);
      color: var(--text-primary);
      transition: border-color 0.2s ease;
    }

    input[type="email"]:focus {
      outline: none;
      border-color: var(--button-primary);
    }

    input[type="email"]::placeholder {
      color: var(--text-secondary);
    }

    .btn-primary {
      width: 100%;
      padding: 12px 16px;
      background-color: var(--button-primary);
      color: #ffffff;
      border: none;
      border-radius: 6px;
      font-family: 'Raleway', sans-serif;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s ease;
    }

    .btn-primary:hover {
      opacity: 0.9;
    }

    .btn-primary:active {
      transform: scale(0.98);
    }

    .btn-primary:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .success-message {
      text-align: center;
      padding: 20px;
      background-color: var(--bg-secondary);
      border-radius: 12px;
      animation: slideUp 0.5s ease-out;
    }

    .success-message h2 {
      font-family: 'Playfair Display', serif;
      font-size: 20px;
      margin-bottom: 12px;
      color: var(--text-primary);
    }

    .success-message p {
      font-size: 14px;
      color: var(--text-secondary);
      line-height: 1.6;
    }

    .loading {
      display: inline-block;
      width: 14px;
      height: 14px;
      border: 2px solid var(--border-color);
      border-top-color: var(--button-primary);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    @media (max-width: 480px) {
      .login-container {
        padding: 30px 20px;
      }

      h1 {
        font-size: 20px;
      }

      .subtitle {
        font-size: 13px;
      }
    }
  </style>
</head>

    <h1>Acceder al Dashboard de Crece</h1>
    <p class="subtitle">Ingresa tu correo electrónico para recibir tu enlace de acceso de una sola vez.</p>
    <form id="emailForm" onsubmit="handleSubmit(event)">
      <div class="form-group">
        <input
          type="email"
          id="emailInput"
          placeholder="tu@correo.com"
          required
          autocomplete="email"
        >
      </div>
      <button type="submit" class="btn-primary" id="submitBtn">Enviar enlace de acceso</button>
    </form>
  </div>

  <script>
    const API_ENDPOINT = '/api-auth-request.php';

    async function handleSubmit(event) {
      event.preventDefault();

      const emailInput = document.getElementById('emailInput');
      const submitBtn = document.getElementById('submitBtn');
      const email = emailInput.value.trim();

      if (!email) {
        return;
      }

      submitBtn.disabled = true;
      const originalText = submitBtn.textContent;
      submitBtn.innerHTML = '<span class="loading"></span>';

      try {
        const response = await fetch(API_ENDPOINT, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ email })
        });

        if (response.ok) {
          showSuccessMessage();
        } else {
          submitBtn.textContent = originalText;
          submitBtn.disabled = false;
          alert('Hubo un error. Por favor intenta de nuevo.');
        }
      } catch (error) {
        console.error('Error:', error);
        submitBtn.textContent = originalText;
        submitBtn.disabled = false;
        alert('Hubo un error de conexión. Por favor intenta de nuevo.');
      }
    }

    function showSuccessMessage() {
      const loginForm = document.getElementById('loginForm');
      loginForm.innerHTML = `
        <div class="success-message">
          <h2>¡Enlace enviado!</h2>
          <p>Si tu correo está autorizado, recibirás un enlace para entrar al Dashboard de Crece. Por favor revisa tu bandeja de entrada (y la carpeta de spam).<br><br>El enlace expira en 15 minutos.</p>
        </div>
      `;
    }
  </script>
